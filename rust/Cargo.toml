[package]
name = "cdk-nitro"
version = "0.16.0"
edition = "2021"


[lib]
crate-type = ["staticlib", "cdylib"]
name = "cdk_nitro"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_panics_doc = "allow"
missing_safety_doc = "allow"
unwrap_used = "allow"

[dependencies]
cashu = "=0.16.0"
cdk = { version = "=0.16.0", default-features = false }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
