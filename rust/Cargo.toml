[package]
name = "cdk-nitro"
version = "0.17.3"
edition = "2021"


[lib]
crate-type = ["staticlib", "cdylib"]
name = "cdk_nitro"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_panics_doc = "allow"
missing_safety_doc = "allow"

[dependencies]
cashu = "=0.17.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
